name: Cleanup Old GHCR Images

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete orphaned sha256 digests and old builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch orphaned sha256 digests and .sig manifests (no main release tags)
          UNTAGGED_IDS=$(gh api "/user/packages/container/bluecore/versions?per_page=100" \
            --jq '.[] | select((.metadata.container.tags // []) | map(select(test("latest|202[0-9]"))) | length == 0) | .id')

          for ID in $UNTAGGED_IDS; do
            echo "Deleting orphaned digest ID: $ID"
            gh api --method DELETE "/user/packages/container/bluecore/versions/$ID" || true
          done

          # 2. Fetch primary tagged builds (containing 2026... or latest), keep 5 newest, delete older ones
          OLD_BUILD_IDS=$(gh api "/user/packages/container/bluecore/versions?per_page=100" \
            --jq '[.[] | select((.metadata.container.tags // []) | map(select(test("latest|202[0-9]"))) | length > 0)] | sort_by(.created_at) | reverse | .[5:] | .[].id')

          for ID in $OLD_BUILD_IDS; do
            echo "Deleting old tagged build ID: $ID"
            gh api --method DELETE "/user/packages/container/bluecore/versions/$ID" || true
          done
          

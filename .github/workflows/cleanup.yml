name: Cleanup Old GHCR Images

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Clean GHCR Packages
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Delete untagged image layers
          delete-untagged: true
          # Keep the most recent untagged builds/manifests as rollback history
          keep-n-untagged: 5
          # Clean up orphaned multi-platform/attestation digests
          delete-orphaned-images: true
          delete-partial-images: true
          # Never delete the active 'latest' tag
          exclude-tags: 'latest'
          

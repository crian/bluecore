name: Cleanup Old GHCR Images

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Clean GHCR Packages
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep only the 5 most recent tagged builds
          keep-n-tagged: 5
          # Explicitly delete old untagged layers and orphaned digests
          delete-untagged: true
          delete-orphaned-images: true
          delete-partial-images: true
          # Delete the signature/attestation tags starting with sha256-
          delete-tags: '^sha256-'
          use-regex: true
          # Never delete the primary 'latest' tag
          exclude-tags: 'latest'
          

name: Cleanup Old GHCR Images

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete untagged and orphaned sha256 digests via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Get all package version IDs that DO NOT contain the main release tags
          # Keeps 'latest' and the 5 most recent date tags, deletes everything else (orphaned sha256 & old builds)
          VERSIONS_TO_DELETE=$(gh api "/user/packages/container/bluecore/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags | index("latest") | not) | .id' | tail -n +6)

          if [ -z "$VERSIONS_TO_DELETE" ]; then
            echo "No old versions or orphaned digests found to delete."
            exit 0
          fi

          # 2. Iterate and delete the old versions
          for VERSION_ID in $VERSIONS_TO_DELETE; do
            echo "Deleting version ID: $VERSION_ID"
            gh api --method DELETE "/user/packages/container/bluecore/versions/$VERSION_ID" || true
          done
          
